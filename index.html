<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>그림책 이야기 상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
  /* Layout: 이야기마다 큰 표지 카드 하나. 누르면 그 이야기 그림책으로 이동. */
  :root {
    --bg: #e9f4ff;
    --surface: #ffffff;
    --ink: #1b2a4a;
    --muted: #4d5d7a;
    --accent: #ff6f3c;
    --accent-ink: #ffffff;
    --line: #b4d0ee;
    --shadow: rgba(27, 42, 74, .22);
    --font-display: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --font-body: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1830; --surface: #1a2748; --ink: #eef3ff; --muted: #a9b8d9;
      --accent: #ff8a5c; --accent-ink: #1a1020; --line: #34497a; --shadow: rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1830; --surface: #1a2748; --ink: #eef3ff; --muted: #a9b8d9;
    --accent: #ff8a5c; --accent-ink: #1a1020; --line: #34497a; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.05; text-wrap: balance; }
  .lead { margin: 0; font-size: clamp(1.05rem, 3.4vw, 1.3rem); color: var(--muted); line-height: 1.6; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; }
  a.story {
    display: grid; gap: 0; text-decoration: none; color: inherit; overflow: hidden;
    background: var(--surface); border: 4px solid var(--surface); border-radius: 28px;
    box-shadow: 0 9px 0 var(--shadow); transition: transform .12s, box-shadow .12s;
  }
  a.story:hover { transform: translateY(-3px); }
  a.story:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--shadow); }
  a.story:focus-visible { outline: 5px solid var(--accent); outline-offset: 4px; }
  a.story img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .cap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 16px; }
  .cap strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.15; }
  .go {
    flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .go svg { width: 28px; height: 28px; }
  .note { margin: 0; padding: 14px 18px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); line-height: 1.6; font-size: .95rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>이야기를 골라요</h1>
  </header>
  <p class="lead">그림을 누르면 이야기가 시작돼요.</p>
  <div class="shelf" id="shelf"></div>
  <p class="note">선생님께: 이야기마다 그림책이 따로 열립니다. 마이크로 녹음하려면 컴퓨터에 저장한 파일을 열어서 사용하세요. 이야기 파일은 모두 같은 폴더에 두어야 서로 연결됩니다.</p>
</div>
